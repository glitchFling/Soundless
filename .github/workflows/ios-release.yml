name: iOS IPA Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_ref:
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 0.0.1; no v prefix)'
        required: true
        default: '0.0.1'
        type: string

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and release target
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$VERSION" == "0.0.0" ]]; then
            echo "::error::Use a numeric version starting at 0.0.1, such as 0.0.1 or 0.0.2."
            exit 1
          fi
          TAG="v$VERSION"
          COMMIT="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$COMMIT" ]]; then
              echo "::error::Tag $TAG points to a different commit. Choose a new version."
              exit 1
            fi
          fi
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build iPhone archive
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project MathBeatStudio.xcodeproj \
            -scheme MathBeatStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MathBeatStudio.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

      - name: Package unsigned IPA
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MathBeatStudio.xcarchive/Products/Applications/MathBeatStudio.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/MathBeatStudio.app"
          cd "$RUNNER_TEMP/ipa"
          zip -q -r -y "$GITHUB_WORKSPACE/dist/MathBeatStudio-$VERSION-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE/dist"
          unzip -t "MathBeatStudio-$VERSION-unsigned.ipa"
          shasum -a 256 "MathBeatStudio-$VERSION-unsigned.ipa" > SHA256SUMS.txt

      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MathBeatStudio-${{ steps.version.outputs.number }}-unsigned
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Native iPhone sequencer with 16 steps, adjustable BPM, four oscillators, PCM loop playback, and local JSON projects.

          **This IPA is unsigned.** It must be signed with a compatible iOS signing/sideloading tool before installation. It is not an App Store or TestFlight distribution build. Requires iOS 17 or later.

          SHA256SUMS.txt contains the IPA checksum.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Do not replace an asset already published under this version.
            gh release upload "$TAG" "dist/MathBeatStudio-$VERSION-unsigned.ipa" dist/SHA256SUMS.txt
          else
            gh release create "$TAG" \
              "dist/MathBeatStudio-$VERSION-unsigned.ipa" dist/SHA256SUMS.txt \
              --target "$(git rev-parse HEAD)" \
              --title "MathBeat Studio $VERSION" \
              --prerelease=false \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
